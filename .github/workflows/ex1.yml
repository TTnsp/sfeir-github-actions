name: npm test
on: 
  workflow_dispatch:
               
jobs:
  install:
    runs-on: ubuntu-latest
    steps: 
    - name: cloning repo files into the vm 
      uses: actions/checkout@v6
    - name: install node
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: install dependencies
      run: npm install
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
    - name: cloning repo files into the vm 
      uses: actions/checkout@v6
    - name: install node
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: run test
      run: npm test